services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: procurex
      POSTGRES_USER: procurex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-procurex_demo_password}
    volumes:
      - procurex_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procurex -d procurex"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://procurex:${POSTGRES_PASSWORD:-procurex_demo_password}@db:5432/procurex
      JWT_SECRET: ${JWT_SECRET:-local-demo-only-change-this-secret}
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend/sfpms-frontend-best
    environment:
      VITE_API_URL: http://localhost:8001
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  procurex_db:
